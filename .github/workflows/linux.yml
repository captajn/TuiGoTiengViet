name: Linux

# Upstream runs manual-only to save Actions minutes; on forks a push builds
# automatically so contributors can verify their own copy without secrets.
on:
  workflow_dispatch:
  push:

jobs:
  build-test:
    if: github.event_name != 'push' || github.repository != 'captajn/TuiGoTiengViet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: |
            linux/go.sum
            linux/settings/go.sum
      - name: Dependencies (IBus + Fyne GL + headless session)
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq
          ibus gir1.2-ibus-1.0 python3-gi dbus-x11 xvfb
          libgl1-mesa-dev xorg-dev pkg-config
      - name: Test + build + e2e
        run: sh scripts/check-linux.sh
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/tuigo-linux-x86_64.tar.gz -C linux dist data install.sh uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tuigo-linux
          path: dist/tuigo-linux-x86_64.tar.gz
          if-no-files-found: error
