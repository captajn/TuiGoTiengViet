name: macOS

# Upstream runs manual-only to save Actions minutes; on forks a push builds
# automatically so contributors can verify their own copy without secrets.
on:
  workflow_dispatch:
  push:

jobs:
  app-build:
    if: github.event_name != 'push' || github.repository != 'captajn/TuiGoTiengViet'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests + unsigned .app build
        run: |
          brew install xcodegen
          sh scripts/check-macos.sh
      - name: Package app bundle
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "Tui Go.app" "$GITHUB_WORKSPACE/dist/tuigo-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tuigo-macos-app
          path: dist/tuigo-macos.zip
          if-no-files-found: error
