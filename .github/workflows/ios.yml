name: iOS

# Manual only — push/PR builds disabled to save Actions minutes.
on:
  workflow_dispatch:

jobs:
  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mobile metadata
        id: meta
        run: python3 -P scripts/mobile-release.py metadata
      - name: Verify palette, engine and simulator build
        run: |
          brew install xcodegen
          sh scripts/check-ios.sh
      - name: Build app + keyboard extension (unsigned, device)
        working-directory: ios
        run: >-
          xcodebuild -project TuiGo.xcodeproj -scheme TuiGo
          -destination 'generic/platform=iOS' -configuration Release
          -derivedDataPath build build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package and inspect unsigned IPA
        run: >-
          python3 -P scripts/mobile-release.py ipa
          --source ios/build/Build/Products/Release-iphoneos --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: tuigo-unsigned-ipa
          path: dist/${{ steps.meta.outputs.ipa_name }}
          if-no-files-found: error
