name: Release

on:
  push:
    tags:
      - 'v*'
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release (vd: v0.1.0 hoặc mobile-v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    # Windows-only: tag `v*` — mobile tags skip this job
    if: ${{ !startsWith(github.event.inputs.tag || github.ref_name, 'mobile-v') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: app/go.sum

      - name: Test app and engine
        run: go test ./... -v

      - name: Vet
        run: go vet ./...

      - name: Resolve version
        working-directory: .
        run: |
          $v = "${{ github.event.inputs.tag || github.ref_name }}" -replace '^v',''
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build x64
        run: go build -ldflags "-H windowsgui -s -w -X main.appVersion=$env:APP_VERSION" -o tuigo.exe .

      - name: Build ARM64
        run: go build -ldflags "-H windowsgui -s -w -X main.appVersion=$env:APP_VERSION" -o tuigo-arm64.exe .
        env:
          GOARCH: arm64

      - name: Build updater x64
        run: go build -ldflags "-H windowsgui -s -w" -o tuigo-updater.exe ./updater

      - name: Build updater ARM64
        run: go build -ldflags "-H windowsgui -s -w" -o tuigo-updater-arm64.exe ./updater
        env:
          GOARCH: arm64

      - name: Package
        working-directory: app
        run: |
          Compress-Archive -Path tuigo.exe, tuigo-updater.exe -DestinationPath tuigo-x64.zip -Force
          Compress-Archive -Path tuigo-arm64.exe, tuigo-updater-arm64.exe -DestinationPath tuigo-arm64.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Tui Gõ ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            app/tuigo-x64.zip
            app/tuigo-arm64.zip
            app/tuigo.exe
            app/tuigo-arm64.exe
            app/tuigo-updater.exe
            app/tuigo-updater-arm64.exe

  apk:
    if: ${{ startsWith(github.event.inputs.tag || github.ref_name, 'mobile-v') }}
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Mobile metadata and palette
        id: meta
        run: |
          python3 -P scripts/mobile-release.py metadata --tag "$RELEASE_TAG"
          python3 -P scripts/check-palette.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/tuigo-release.jks
          {
            echo "storeFile=keystore/tuigo-release.jks"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > keystore.properties
      - name: Test, lint and build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew :engine:test :app:assembleRelease :app:lintRelease --console=plain
          else
            ./gradlew :engine:test :app:assembleDebug :app:lintDebug --console=plain
          fi
      - name: Package exact APK variant
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            src=android/app/build/outputs/apk/release/app-release.apk
            echo 'APK signing: release key'
          else
            src=android/app/build/outputs/apk/debug/app-debug.apk
            echo 'APK signing: debug key (no release secret configured)'
          fi
          python3 -P scripts/mobile-release.py apk --tag "$RELEASE_TAG" --source "$src" --output dist
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          signer=$(find "$sdk/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose "dist/${{ steps.meta.outputs.apk_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: dist/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

  ipa:
    if: ${{ startsWith(github.event.inputs.tag || github.ref_name, 'mobile-v') }}
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Mobile metadata
        id: meta
        run: python3 -P scripts/mobile-release.py metadata --tag "$RELEASE_TAG"
      - name: Verify palette, engine and simulator build
        run: |
          brew install xcodegen
          sh scripts/check-ios.sh
      - name: Build app + keyboard extension (unsigned, device)
        working-directory: ios
        run: >-
          xcodebuild -project TuiGo.xcodeproj -scheme TuiGo
          -destination 'generic/platform=iOS' -configuration Release
          -derivedDataPath build build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package and inspect unsigned IPA
        run: >-
          python3 -P scripts/mobile-release.py ipa --tag "$RELEASE_TAG"
          --source ios/build/Build/Products/Release-iphoneos --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ipa
          path: dist/${{ steps.meta.outputs.ipa_name }}
          if-no-files-found: error

  mobile-release:
    needs: [apk, ipa]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Mobile metadata
        id: meta
        run: python3 -P scripts/mobile-release.py metadata --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          merge-multiple: true
          path: dist
      - name: Verify release assets
        run: |
          test -s "dist/${{ steps.meta.outputs.apk_name }}"
          python3 -P scripts/mobile-release.py check-ipa --tag "$RELEASE_TAG" --source "dist/${{ steps.meta.outputs.ipa_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.meta.outputs.release_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Android: APK signed with the configured release key; debug-signed fallback if no Android release secret is configured.
            iOS: unsigned IPA containing the app and keyboard extension. Apple signing/provisioning is required before installation on an iPhone or iPad.
          files: |
            dist/${{ steps.meta.outputs.apk_name }}
            dist/${{ steps.meta.outputs.ipa_name }}
