name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests (JVM — no emulator needed)
        working-directory: android
        run: ./gradlew :engine:test --console=plain

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: tuigo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/tuigo-release.jks
          {
            echo "storeFile=keystore/tuigo-release.jks"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: tuigo-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: android/engine/build/reports/tests/test/
