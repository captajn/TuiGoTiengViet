name: Android

# Upstream runs manual-only to save Actions minutes; on forks a push builds
# automatically so contributors can verify their own copy without secrets.
on:
  workflow_dispatch:
  push:

jobs:
  build:
    if: github.event_name != 'push' || github.repository != 'captajn/TuiGoTiengViet'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Mobile metadata and palette
        id: meta
        run: |
          python3 -P scripts/mobile-release.py metadata
          python3 -P scripts/check-palette.py
          chmod +x android/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests (JVM — no emulator needed)
        working-directory: android
        run: ./gradlew :engine:test --console=plain

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug --console=plain

      - name: Package debug APK
        run: python3 -P scripts/mobile-release.py apk --source android/app/build/outputs/apk/debug/app-debug.apk --output dist/debug
      - uses: actions/upload-artifact@v4
        with:
          name: tuigo-debug-apk
          path: dist/debug/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/tuigo-release.jks
          {
            echo "storeFile=keystore/tuigo-release.jks"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:lintRelease --console=plain

      - name: Package release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: python3 -P scripts/mobile-release.py apk --source android/app/build/outputs/apk/release/app-release.apk --output dist/release
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: tuigo-release-apk
          path: dist/release/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: android/engine/build/reports/tests/test/
