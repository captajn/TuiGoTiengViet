name: TuiGoMac

options:
  bundleIdPrefix: com.tuigo
  createIntermediateGroups: true
  developmentLanguage: vi

packages:
  TuiGoEngine:
    path: ../ios

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_IDENTITY: "-"

targets:
  TuiGoMac:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
      - path: Resources
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuigo.inputmethod
        PRODUCT_NAME: "Tui Go"
        INFOPLIST_FILE: Resources/Info.plist
    dependencies:
      - package: TuiGoEngine
        product: TuiGoEngine

schemes:
  TuiGoMac:
    build:
      targets:
        TuiGoMac: all
    run:
      config: Debug
